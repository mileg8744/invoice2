<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('login') }} · {{ t('app_title') }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="lang-toggle login-lang">
    <a class="{% if lang == 'ko' %}on{% endif %}" href="{{ url_for('lang', code='ko') }}">KO</a>
    <a class="{% if lang == 'en' %}on{% endif %}" href="{{ url_for('lang', code='en') }}">EN</a>
  </div>
  <div class="login-wrap">
    <div class="login-hero">
      <img class="brand-ci login-ci" src="{{ url_for('static', filename='img/pgu_ci_white.png') }}" alt="POSCO Group University">
      <p>{{ t('login_caption') }}</p>
    </div>
    <form class="login-card" method="post">
      <h2>{{ t('login') }}</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <label>{{ t('username') }}</label>
      <input class="form-control" name="username" autofocus required>
      <label>{{ t('password') }}</label>
      <input class="form-control" type="password" name="password" required>
      <button class="btn btn-navy w-100 mt-3" type="submit">{{ t('login_btn') }}</button>
      <div class="login-help">
        HQ Admin: <b>admin / admin1004</b><br>
        {{ t('corp_badge') }}: 01AR01 … 07HK01 / <b>posco1234</b>
      </div>
    </form>
  </div>
</body>
</html>
